[package]
name = "raven-init"
version = "0.1.0"
edition = "2021"
authors = ["RavenLinux Team"]
description = "RavenLinux Init System - PID 1 process manager"
license = "MIT"

[dependencies]
# Unix/Linux system calls
# "user" is what setgroups/setgid/setuid live behind -- see apply_credentials
# in service.rs, which drops a service to its configured account.
nix = { version = "0.28", features = ["signal", "process", "mount", "fs", "hostname", "reboot", "term", "ioctl", "user", "poll"] }

# Direct libc access for sync()
libc = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"

# Configuration parsing
toml = "0.8"
# Format-preserving TOML, for rewriting `enabled` in init.toml without
# flattening the comments and layout someone put there by hand. Already in the
# tree underneath toml 0.8, so this costs no new dependencies.
toml_edit = "0.22"
serde = { version = "1.0", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime for service management (optional, can use sync for simplicity)
# Using synchronous approach for init to minimize dependencies

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"  # Optimize for size
strip = true

[[bin]]
name = "raven-init"
path = "src/main.rs"

[[bin]]
name = "raven-rc"
path = "src/rc.rs"

# The power-button, sleep-button and lid daemon. In this crate rather than one
# of its own because it is the other half of init's suspend: init owns the
# write to /sys/power/state, this owns deciding when to ask for it, and the two
# share the control socket's protocol.
[[bin]]
name = "raven-powerd"
path = "src/powerd.rs"

# The port and peripheral inventory, and the wired-link watcher that gets a
# dock's NIC a lease when it appears. In this crate because it is init's
# hotplug half: init.toml runs `raven-ports watch --react` as a service and
# it reuses the same raven-dhcp invocation the boot-time network service does.
[[bin]]
name = "raven-ports"
path = "src/ports.rs"

# The clock daemon: SNTP sync and the /etc/localtime symlink. In this crate
# because it is the other half of init's `hwclock --hctosys` -- init reads the
# RTC at boot, this keeps it worth reading -- and its socket follows powerd's
# pattern exactly.
[[bin]]
name = "raven-timed"
path = "src/timed.rs"

# Removable storage: the daemon that turns a plugged-in drive into a directory
# under /media. In this crate because it is the other half of init's mount
# work -- init mounts what init.toml names, this mounts what arrives later --
# and because it resolves the session account with the same `user` module
# overrides.rs uses, so the two cannot disagree about who owns a FAT volume.
[[bin]]
name = "raven-mount"
path = "src/mount.rs"

# The fingerprint sensor's driver and the only process that touches it. In this
# crate because it is the same kind of thing as raven-powerd and raven-mount: a
# small privileged daemon that owns one piece of hardware the kernel exposes and
# nothing else claims. It shares no code with init itself, and deliberately
# shares no code with ravend -- see src/fprintd.rs for why the process holding
# /etc/shadow does not also drive a USB device.
[[bin]]
name = "raven-fprintd"
path = "src/fprintd.rs"
