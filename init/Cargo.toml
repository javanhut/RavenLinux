[package]
name = "raven-init"
version = "0.1.0"
edition = "2021"
authors = ["RavenLinux Team"]
description = "RavenLinux Init System - PID 1 process manager"
license = "MIT"

[dependencies]
# Unix/Linux system calls
# "user" is what setgroups/setgid/setuid live behind -- see apply_credentials
# in service.rs, which drops a service to its configured account.
nix = { version = "0.28", features = ["signal", "process", "mount", "fs", "hostname", "reboot", "term", "ioctl", "user"] }

# Direct libc access for sync()
libc = "0.2"

# Logging
log = "0.4"
env_logger = "0.11"

# Configuration parsing
toml = "0.8"
# Format-preserving TOML, for rewriting `enabled` in init.toml without
# flattening the comments and layout someone put there by hand. Already in the
# tree underneath toml 0.8, so this costs no new dependencies.
toml_edit = "0.22"
serde = { version = "1.0", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime for service management (optional, can use sync for simplicity)
# Using synchronous approach for init to minimize dependencies

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"  # Optimize for size
strip = true

[[bin]]
name = "raven-init"
path = "src/main.rs"

[[bin]]
name = "raven-rc"
path = "src/rc.rs"

# The power-button, sleep-button and lid daemon. In this crate rather than one
# of its own because it is the other half of init's suspend: init owns the
# write to /sys/power/state, this owns deciding when to ask for it, and the two
# share the control socket's protocol.
[[bin]]
name = "raven-powerd"
path = "src/powerd.rs"
