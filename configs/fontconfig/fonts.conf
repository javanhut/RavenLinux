<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Minimal, self-contained fontconfig configuration for Raven images.

       RavenLinux ships exactly one family, JetBrains Mono Nerd Font, in
       /usr/share/fonts. tty1 does not use these files at all: the Linux
       console draws from the PSF bitmaps stage4 rasterises out of the same TTF
       into /usr/share/kbd/consolefonts. This file is for the Wayland session
       and anything else that resolves fonts through fontconfig. -->

  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!-- The name the TTFs actually register. The Nerd Font patcher writes the
       abbreviated form into the family record, so asking for the spelled-out
       name finds nothing unless it is aliased. Both are listed because either
       is a reasonable thing for a config file to have been written with. -->
  <match target="pattern">
    <test name="family"><string>JetBrains Mono Nerd Font Mono</string></test>
    <edit name="family" mode="assign" binding="same"><string>JetBrainsMono NFM</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>JetBrains Mono</string></test>
    <edit name="family" mode="assign" binding="same"><string>JetBrainsMono NFM</string></edit>
  </match>

  <!-- With one family installed, the generic aliases have to point at it or
       every unstyled request falls through to "no font at all". It is a
       monospace face standing in for sans and serif too, which is a compromise
       the single-family font set forces. -->
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono NFM</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>JetBrainsMono NFM</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>JetBrainsMono NFM</family></prefer>
  </alias>

  <!-- Last resort for a request naming a family that is not installed. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak">
      <string>JetBrainsMono NFM</string>
    </edit>
  </match>

  <!-- Rendering defaults. JetBrains Mono ships hinting instructions worth
       using, and on the HiDPI panels this is most likely to run on, subpixel
       positioning matters more than subpixel colour. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
