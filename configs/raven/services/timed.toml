# raven-timed -- the wall clock: NTP sync and the timezone symlink.
#
# On any image built from this tree you do not need this file: /etc/raven/
# init.toml defines this service itself and raven-init starts it at boot. It is
# shipped for the other case -- an already-installed machine that predates
# raven-timed, where the init.toml on disk is the one the old image wrote and
# nothing will add the service to it.
#
# raven-init reads /etc/raven/init.d/*.toml alongside init.toml, so copying this
# there is how the daemon starts without a reboot and without hand-editing a
# file the next upgrade may replace:
#
#   cp /usr/share/raven/services/timed.toml /etc/raven/init.d/
#   raven-rc reload
#   raven-rc start timed
#
# Leaving it there afterwards is safe. When an init.toml that defines timed
# does arrive, init keeps its own definition and logs that this drop-in was
# ignored -- it cannot end up defined twice.
#
# Ships enabled: a clock that drifts is the state this exists to end. Whether
# the network is actually asked is /etc/raven/time.toml's business, and
# `raven-timed sync off` is how you stop that without stopping the daemon --
# the timezone verbs on its socket are worth having either way.

# No `after = network`: raven-rc treats `after` as a dependency it must start,
# and a machine without the network one-shot would then have no clock daemon
# at all. The daemon retries on its own until the network answers.
[[services]]
name = "timed"
description = "Clock sync and timezone"
exec = "/usr/bin/raven-timed"
args = []
after = []
runtime_dirs = ["/run/raven-time"]
restart = true
enabled = true
critical = false
