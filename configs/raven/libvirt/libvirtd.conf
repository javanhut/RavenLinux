# /usr/share/raven/libvirt/libvirtd.conf -- Raven's libvirtd configuration.
#
# Read instead of /etc/libvirt/libvirtd.conf, because the libvirtd service
# (/etc/raven/init.d/libvirtd.toml) starts the daemon with
# `--config /usr/share/raven/libvirt/libvirtd.conf`. The package's file is
# still there, every line commented out. It is the reference for every key
# this file does not set, and anything not set here takes the same default
# it describes.
#
# The one thing this file changes is how a local client is authorised.
# Upstream asks polkit, and Raven runs no polkitd, so every connection from
# a user who is not root would fail. Here the socket's file mode decides,
# the same way raven-rc and cawd decide: you may connect if you can open
# the socket.
#
#   libvirt-sock     read-write. Group libvirt, mode 0770.
#   libvirt-sock-ro  read-only (virsh list, domain info). Mode 0777, as
#                    upstream.
#
# Membership in libvirt is root on this machine, and it is granted as
# exactly that. A member can define a guest whose disk is /dev/nvme0n1, or
# a storage pool rooted at /, and libvirtd, running as root, will do it.
# raven-install adds the user it creates to libvirt only when it also
# grants sudo, which is already root with a password in front of it. Add
# anyone else with `usermod -aG libvirt <name>`, deliberately.
#
# The libvirt group itself comes from the package: rvn applies
# /usr/lib/sysusers.d/libvirt.conf on install.

unix_sock_group = "libvirt"
unix_sock_ro_perms = "0777"
unix_sock_rw_perms = "0770"

auth_unix_ro = "none"
auth_unix_rw = "none"
