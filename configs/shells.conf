# RavenLinux Shell Configuration
# Default shell: ravenshell (Raven Shell)
# Supported: ravenshell, bash, fish, sh
#
# The Raven stage (scripts/stages/stage-raven.sh) writes the sysroot's
# /etc/shells and switches root's login shell to ravenshell once the binary is
# installed. stage3 leaves bash as the default so a base build without the
# Raven stage still boots to a working shell.

# /etc/shells - valid login shells
/bin/ravenshell
/usr/bin/ravenshell
/bin/bash
/usr/bin/bash
/bin/fish
/usr/bin/fish
/bin/sh
/usr/bin/sh
