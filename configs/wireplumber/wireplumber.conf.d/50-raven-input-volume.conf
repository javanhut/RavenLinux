# Raven: where a microphone starts.
#
# WirePlumber gives an input it has never seen before 100% volume, and
# PipeWire folds a codec's mic-boost amp into that volume -- so 100% means
# every boost step at maximum on top of the capture gain at maximum. On a
# laptop whose internal mic is digital that is +60 dB on a signal that was
# already full scale: the input pins at full scale and every recording of it
# is a roar. (Measured on an HP ALC236 laptop: 87.6% of samples clipped at
# 100%, none at 40%. See configs/kernel/patches/0002-*.)
#
# Start inputs where outputs already start: 0.064 linear, which is 40% on
# the cubic scale every mixer slider shows. An analogue mic that wants more
# is one drag away; a digital one that was pinned at full scale is not
# something a person can diagnose from a roar.
#
# Only for inputs with no remembered volume: once someone sets one, their
# choice is kept (~/.local/state/wireplumber/default-routes).
wireplumber.settings = {
  device.routes.default-source-volume = 0.064
}
