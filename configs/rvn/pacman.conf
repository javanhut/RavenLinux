#
# /etc/pacman.conf -- read by rvn, the RavenLinux package manager
#
# rvn parses this file and the mirrorlists it includes, downloads each repo's
# $repo.db tarball itself, and verifies package signatures against GPGDir.
# Nothing shells out to pacman, and pacman is not installed -- the format is
# shared so that an Arch system keeps working unchanged under rvn, and so that
# RavenLinux reaches the same package set without inventing a second one.
#
# Only the directives below are read. rvn ignores the rest of pacman.conf's
# vocabulary rather than rejecting it, so a configuration copied from an Arch
# machine loads cleanly -- but HoldPkg, HookDir, LogFile, NoExtract and the
# hook machinery genuinely do nothing here, and are left out rather than
# written down as though they were wired up.
#
# This is the canonical file the build installs. It is deliberately not a copy
# of whatever the build host had: a host pacman.conf carries that host's repos
# and mirror ranking, and sometimes a file:// path that exists on no other
# machine. An image that depends on the machine that built it is the thing the
# containerised build exists to avoid. Build with RAVEN_PACMAN_FROM_HOST=1 to
# take the host's configuration anyway, when the host has a repo you need.
#

[options]
# "auto" resolves to the machine's own architecture at run time, so this file
# is not specific to the machine that built the image.
Architecture = auto

DBPath   = /var/lib/pacman/
CacheDir = /var/cache/pacman/pkg/
GPGDir   = /etc/pacman.d/gnupg/

# Arch's own policy, and what rvn assumes for any section that says nothing:
# package signatures required, database signatures optional. rvn implements the
# verification itself against the keyring in GPGDir. The build stages one there;
# without it every install fails closed rather than quietly accepting unsigned
# packages, which is the right way round but still a system that cannot install.
SigLevel = Required DatabaseOptional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
