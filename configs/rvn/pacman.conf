#
# /etc/pacman.conf -- read by rvn, the RavenLinux package manager
#
# rvn parses this file and the mirrorlists it includes, downloads each repo's
# $repo.db tarball itself, and verifies package signatures against GPGDir.
# Nothing shells out to pacman, and pacman is not installed -- the format is
# shared so that an Arch system keeps working unchanged under rvn, and so that
# RavenLinux reaches the same package set without inventing a second one.
#
# Only the directives below are read. rvn ignores the rest of pacman.conf's
# vocabulary rather than rejecting it, so a configuration copied from an Arch
# machine loads cleanly -- but HoldPkg, HookDir, LogFile, NoExtract and the
# hook machinery genuinely do nothing here, and are left out rather than
# written down as though they were wired up.
#
# This is the canonical file the build installs. It is deliberately not a copy
# of whatever the build host had: a host pacman.conf carries that host's repos
# and mirror ranking, and sometimes a file:// path that exists on no other
# machine. An image that depends on the machine that built it is the thing the
# containerised build exists to avoid. Build with RAVEN_PACMAN_FROM_HOST=1 to
# take the host's configuration anyway, when the host has a repo you need.
#

[options]
# "auto" resolves to the machine's own architecture at run time, so this file
# is not specific to the machine that built the image.
Architecture = auto

DBPath   = /var/lib/pacman/
CacheDir = /var/cache/pacman/pkg/
GPGDir   = /etc/pacman.d/gnupg/

# Arch's own policy, and what rvn assumes for any section that says nothing:
# package signatures required, database signatures optional. rvn implements the
# verification itself against the keyring in GPGDir. The build stages one there;
# without it every install fails closed rather than quietly accepting unsigned
# packages, which is the right way round but still a system that cannot install.
SigLevel = Required DatabaseOptional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# 32-bit userland: steam, wine and the lib32-* stack live here and nowhere
# else. Without it `rvn install steam` fails as "not found in any repository".
[multilib]
Include = /etc/pacman.d/mirrorlist

# >>> raven repository
# =============================================================================
# RavenLinux's own packages: ravenshell, rvn, ivaldi, crow, the init crate and
# the desktop -- everything scripts/stages/stage-raven.sh and stage-gui.sh
# build and `rvn build` turns into an archive. Every section above this one
# serves somebody else's software; this is the only one that serves ours, and
# without it an installed machine can never be sent a fix for the package
# manager it is running.
#
# The section is written here, in one place, and shipped commented out.
# install_raven_repo_section in scripts/stages/stage-raven.sh rewrites
# everything between the two markers at build time -- so this block is the one
# copy of the text, and the build decides whether the image gets it live.
# RAVEN_REPO=1 enables it with the Server below; RAVEN_REPO_SERVER=<url>
# enables it and writes that Server instead.
#
# WHY IT IS OFF BY DEFAULT, when Arch's three repositories are not: a
# repository whose Server answers nothing is not inert. `rvn sync` warns about
# it on every run (ops/sync.rs treats one failed repo as a warning as long as
# another succeeded), and `rvn install raven-init` fails closed, which is
# correct behaviour and a poor first hour on a machine that was working. This
# section becomes live when there is something at the other end of it and a
# key in the image to check what comes back -- both of which are decisions,
# not defaults.
#
# WHY SigLevel IS STRICTER HERE than the [options] default. DatabaseOptional
# is the only workable setting for Arch's repositories, which publish no
# database signature at all. This one is built by `rvn repo-add`, which signs
# the database whenever a key is configured, so accepting an unsigned one
# would be accepting a downgrade nobody asked for -- and a repository that
# serves rvn itself is precisely the one worth tampering with. Required means
# a package whose signature does not verify is never installed;
# DatabaseRequired means the package list that names those signatures is
# checked too.
#
# THE OTHER HALF OF THAT IS A KEY. SigLevel = Required with no Raven key in
# /etc/pacman.d/gnupg/pubring.gpg is a repository nothing can install from.
# So the build refuses to produce an image in that state: with this section
# enabled and no key to ship, install_raven_key fails the build. The whole
# procedure -- generating the key, where the private half lives, how the
# public half gets here, and how to build unsigned packages locally without
# touching any of this -- is docs/raven-repository-signing.md.
#
# THE SERVER. The default below is where Raven's packages will be published;
# nothing serves that host yet, which is one more reason this is off. A
# directory on the machine works just as well and is what a local build wants:
#
#     Server = file:///var/cache/raven/repo
#
# rvn reads file:// URLs directly (src/fetch.rs), so a directory `rvn repo-add`
# has written is a usable repository with no web server in front of it. The
# scheme changes nothing about SigLevel: a local repository still has to be
# signed to be installed from under the policy below.
#
# UNCOMMENTING THESE LINES BY HAND HAS ONE MORE STEP, and it is the important
# one. While this section is off, the Raven packages recorded in the image
# belong to no repository at all -- and rvn resolves a package no repository
# carries against the AUR, by name (src/ops/update.rs). AUR names are
# first-come and these versions are low, so without something in the way an
# AUR package called raven-init is presented to you as an upgrade to this
# machine's init system. The build puts something in the way: it writes the
# Raven package names into /usr/share/rvn/provides.d/raven-layer, and rvn
# refuses to install over a name listed there (src/provides.rs, and the check
# at the top of Resolver::resolve in src/resolve.rs). That file is written
# exactly when this section is off, because with the repository live these
# names resolve against it and an upgrade from it is a real one.
#
# So if you turn this section on here, on a running machine, delete
# /usr/share/rvn/provides.d/raven-layer as well -- otherwise [raven] will
# offer upgrades this machine then declines, and the refusal will look like a
# bug. Rebuilding the image with RAVEN_REPO=1 does both at once and is the
# supported way round.
#
# SECTION ORDER IS PRECEDENCE. rvn resolves an exact package name to the
# earliest configured repository that has it, not to the highest version
# (src/resolve.rs:203, which is pacman's rule). [raven] is last, so anything
# whose name also exists in [core] or [extra] resolves to Arch's copy. That is
# the safe arrangement while this repository holds only names nothing else has
# -- ravenshell, rvn, raven-*. The day it publishes RavenLinux's own bash or
# coreutils, this block has to move above [core], and that is a deliberate
# edit rather than something to discover from a machine running the wrong one.
#
# The three lines below are the directives, and are the only lines in this
# block with no space after the #. That is what the build uncomments; every
# other line here is prose and stays prose.
#
#[raven]
#SigLevel = Required DatabaseRequired
#Server = https://packages.ravenlinux.org/$repo/os/$arch
# =============================================================================
# <<< raven repository
