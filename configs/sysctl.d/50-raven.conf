# RavenLinux kernel parameter policy
# /usr/lib/sysctl.d/50-raven.conf
#
# Read once at boot by raven-init's sysctl stage -- which lands in the init
# crate alongside this file; if you are reading a tree where it has not, this
# file is policy nothing applies yet. The stage walks the three directories
# the convention defines -- /usr/lib/sysctl.d, then /run/sysctl.d,
# then /etc/sysctl.d -- takes every *.conf in them in name order, and lets the
# last setting of a key win. Nothing re-reads this file afterwards: to try a
# value now, write it into /proc/sys yourself; to keep it, put it here and
# reboot.
#
# This is the vendor copy and a package update replaces it. Do not edit it on
# an installed machine. Drop a file into /etc/sysctl.d instead -- that
# directory is read last, so any key it names wins over this one, and nothing
# will ever overwrite it.
#
# The name matters twice. `50-` puts this file after 10-arch.conf and after
# systemd's 50-coredump/50-default/50-pid-max, so where Raven and Arch
# disagree Raven wins; and it leaves room for an admin file numbered 60 or
# 90 in /etc/sysctl.d to win in turn.
#
# Every line below is a plain `key = value`. The systemd files beside this one
# use two extensions -- a glob (`net.ipv4.conf.*.rp_filter`) and a leading `-`
# meaning "ignore a key this kernel does not have" -- and this file uses
# neither, deliberately, so that reading it correctly needs nothing more than
# splitting on the first `=`. Where a key may be absent, the comment says so
# and the applier is expected to skip it with a note rather than fail the
# boot.
#
# Worth knowing why this file exists at all, because /usr/lib/sysctl.d already
# had four files in it: nothing on Raven read them. systemd's 50-default.conf
# has said `fs.protected_symlinks = 1` all along, and the running kernel still
# reported 0, because the program that applies these directories is part of
# systemd and Raven does not run it. The file without the stage was decoration;
# the stage without the file would have no policy to apply.
#
# What is deliberately not here: the firewall, which is /etc/nftables.conf and
# a service that loads it; anything decided at kernel build time, which lives
# in configs/kernel/config-6.17-raven; and general network-stack tuning --
# buffer sizes, congestion control, queue disciplines -- where the kernel's own
# defaults are better than a number somebody copied out of a 2009 blog post.

# =============================================================================
# Kernel information exposure
# =============================================================================

# Print kernel pointers as zeroes in /proc/kallsyms, /proc/modules and every
# other interface that would otherwise hand out a kernel address.
#
# 1 hides them from unprivileged readers; 2 hides them from everyone,
# including root and including a process holding CAP_SYSLOG. 2 is the right
# setting here because the whole value of an address leak is defeating KASLR,
# and a leak that only root can read is still a leak the moment anything root
# runs writes it into a log, a crash report or a bug attachment.
#
# What it costs: a profiler cannot resolve kernel symbols, so `perf top` and
# bpftrace show addresses instead of function names. Neither is in the base
# image -- install either and this is the line to relax, in /etc/sysctl.d, for
# as long as you are profiling.
kernel.kptr_restrict = 2

# Restrict the kernel ring buffer to CAP_SYSLOG. An unprivileged `dmesg` gets
# EPERM; `sudo dmesg` and journal-style readers running as root are unchanged.
#
# The ring buffer is the most casually quoted source of hardware serial
# numbers, MAC addresses, memory layout and driver-internal addresses on the
# machine, and none of that needs to be legible to every process that can
# open a file.
#
# What it costs, concretely: the error raven-powerd raises when a suspend is
# refused ends "see dmesg" (init/src/power.rs:148). The daemon is root and
# reads it fine; the person it is talking to now needs sudo to follow the
# advice. That is the trade, and it is worth taking -- but it is the reason
# to reach for `sudo dmesg` before assuming the ring buffer is empty.
kernel.dmesg_restrict = 1

# ptrace only between a process and its own descendants. A debugger still
# attaches to a program it started, which is what gdb, strace and a crash
# handler all do; what stops is one already-running process of yours reading
# another's memory without either being the other's parent.
#
# This is the line that closes the "one compromised application reads every
# other application's memory, including the browser holding your session
# cookies" path, and it costs almost nothing, because the tools that need to
# attach after the fact -- gdb -p, strace -p -- are run with sudo anyway.
# A process that wants to be debugged by a sibling can still allow it with
# prctl(PR_SET_PTRACER), which is how crash reporters keep working.
#
# THIS KEY DOES NOT EXIST ON EVERY RAVEN KERNEL. It is provided by the Yama
# LSM, a build-time choice: without CONFIG_SECURITY_YAMA=y there is no
# /proc/sys/kernel/yama directory at all and this line names nothing. As this
# file is written the shipped kernel config still says
# `# CONFIG_SECURITY_YAMA is not set` and the option is being turned on
# separately; note that CONFIG_LSM already lists yama in its string, which is
# misleading -- a module that was not compiled in does nothing however it is
# ordered. Until a kernel carrying Yama boots, the applier must treat this
# line the way it treats any key whose /proc/sys path is missing: skip it and
# say so once, never fail the stage.
kernel.yama.ptrace_scope = 1

# =============================================================================
# Filesystem: the shared-directory traps
# =============================================================================
#
# All four of these close the same family of bug: a program running as one
# user opens a path in a world-writable directory -- /tmp, /var/tmp,
# /dev/shm -- and somebody else has put something there first. They have been
# the recommended defaults for a decade and every distribution that applies
# its sysctl files already has them on. Raven's were 0 only because nothing
# applied the file that set them.

# Do not let a user hardlink to a file they can neither read nor own. The
# attack is linking to a root-owned file in /tmp and waiting for a privileged
# program to open the link and write through it.
fs.protected_hardlinks = 1

# In a world-writable sticky directory, do not follow a symlink whose owner is
# neither the directory's owner nor the process following it. This is the
# classic /tmp symlink race: predict the temporary name a root program will
# open, plant a symlink to /etc/shadow, wait.
fs.protected_symlinks = 1

# The same rule for FIFOs, and for regular files, opened for writing in a
# world-writable sticky directory when somebody else owns them. A program that
# blindly opens its temp file with O_CREAT and finds a FIFO another user made
# blocks forever on the open; one that finds a regular file another user made
# writes its output into a file that user can read.
#
# These two are the pair most likely to surprise a daemon that shares a
# spool directory on purpose, so check printing after a change here: cupsd
# and ipp-usb both write under /run and /var/spool/cups as one account and
# read as another. They are correct today -- both use their own directories
# with proper ownership rather than a world-writable one -- but "it broke
# printing" is what a regression here looks like.
fs.protected_fifos = 1
fs.protected_regular = 1

# =============================================================================
# Network
# =============================================================================

# Strict reverse-path filtering: drop a packet arriving on an interface that
# is not the one this machine would use to reply to its source address. It is
# the cheapest possible anti-spoofing rule and it runs before anything the
# firewall does.
#
# Only `all` is set, and that is enough: the kernel uses the maximum of
# net.ipv4.conf.all.rp_filter and the per-interface value, so raising `all`
# raises every interface, including ones that appear later -- a dock plugged
# in an hour after boot, a tunnel, a VM bridge. Setting `default` as well
# would change nothing.
#
# The risk this carries on THIS class of machine is worth stating plainly.
# Strict mode breaks asymmetric routing, and a laptop is where asymmetric
# routing happens: a dock's wired NIC and the wifi are both up, both have a
# default route, and a reply comes back on the one that did not send. The
# machine this was written on has exactly that pair -- enp0s13f0u3u1i5 and
# wlp0s20f3. In practice the dock and the wifi are on the same subnet and
# the metric ordering keeps traffic on one of them, which is why strict is
# the right default; if you run a multi-homed setup on purpose and see
# traffic vanish on one interface, the fix is `net.ipv4.conf.all.rp_filter =
# 2` in /etc/sysctl.d -- loose mode, which only requires the source to be
# reachable by some route, and which is what systemd's 50-default.conf asks
# for and Arch has shipped for years.
#
# There is no IPv6 counterpart. The kernel does not implement rp_filter for
# IPv6 at all; the equivalent there is an rpfilter match in the firewall.
net.ipv4.conf.all.rp_filter = 1

# =============================================================================
# Memory: tuning, not security
# =============================================================================
#
# Nothing below this line defends against anything. It is here because the
# kernel's defaults were chosen when a swap partition meant a spinning disk
# and a seek cost ten milliseconds, and Raven's target machine has neither.

# How readily the kernel pages anonymous memory out rather than dropping file
# cache. 0 is not "never swap"; it is "swap only to avoid the OOM killer".
#
# 60 is the kernel's default and it is a 2005 default: it assumes paging out
# is roughly as expensive as losing cache, which was true of a disk that had
# to seek. It is not true here. The root filesystem is NVMe, and zswap is on
# (/sys/module/zswap/parameters/enabled reads Y), so the first place a page
# goes when it is evicted is a compressed pool in RAM -- cheap -- and only
# what will not compress reaches the device.
#
# The observed symptom that motivated the change: on the machine this was
# written on, with gigabytes still free, more than a gigabyte of anonymous
# memory had already been paged out. None of it was idle by any measure a
# person would use; it was paged out because the default says to prefer that
# over shrinking the cache. The cost is a desktop where switching back to the
# window you used twenty minutes ago waits on a page-in.
#
# 10 does not disable swap and does not stop zswap from working -- under real
# pressure the machine still swaps, and should. It moves the balance so that
# the page cache is shrunk first, which is where a desktop's spare memory
# should be spent.
vm.swappiness = 10

# How hard the kernel works to reclaim the dentry and inode caches, as a
# percentage-ish weight against page-cache reclaim. 100 means "at the same
# rate"; higher means "drop metadata first".
#
# 50 keeps directory entries and inodes around about twice as long as the
# default. That metadata is what makes a second `ls` of a large tree, a
# rebuild that stats ten thousand files, or a package operation walking the
# filesystem fast; it is small, and re-reading it costs a filesystem lookup
# rather than a memcpy. Halving the pressure is the standard desktop and
# build-machine adjustment, and it pairs with the swappiness change above:
# together they say "hold on to cheap-to-keep cache, don't page out the
# application to do it".
#
# Do not take this far below 50. At very low values the kernel will not
# reclaim metadata even when it should, and a machine that walks a very large
# tree -- a full `rvn` repository sync, a kernel build -- can end up under
# memory pressure holding a dentry cache it refuses to shrink.
vm.vfs_cache_pressure = 50
