# RavenLinux Init Configuration
# /etc/raven/init.toml

[system]
# System hostname (can be overridden by /etc/hostname)
hostname = "raven-linux"

# Default runlevel/target
default_runlevel = "default"

# Shutdown timeout in seconds (services have this long to stop)
shutdown_timeout = 10

# Enable automatic kernel module loading
load_modules = true

# Enable udev/eudev for device management
enable_udev = true

# Enable network initialization
enable_network = true

# Log level: trace, debug, info, warn, error
log_level = "info"


# =============================================================================
# Services
# =============================================================================

# Device manager, before anything that needs a device.
#
# The graphics and wireless drivers are modules rather than built into the
# kernel: a built-in driver asks the firmware loader for its blobs at probe,
# before any filesystem holding firmware is mounted, and never retries. As
# modules they load from the mounted root, where /lib/firmware is readable --
# but only if something coldplugs them, which is what this does. It runs first
# because everything below it assumes its hardware exists.
#
# restart = false: raven-udev daemonises udevd and the coldplug is a one-shot,
# so nothing is left in the foreground to supervise.
#
# `type = "oneshot"` says the same thing the other way round, and says it to
# the supervisor rather than to the reader. restart = false only tells init
# not to start the process again; it does not tell it that the process
# finishing is the service succeeding. So a one-shot that has done its job
# sits in the roster as `exited`, which is the same word `raven-rc list`
# prints for obexd, a daemon that has failed 1663 times -- and a status
# display where success and permanent failure share a word is a status
# display nobody reads. The type is what lets init tell those two apart.
#
# Every one-shot in this tree is marked: udev, console-font and network here,
# postinstall in its template. The key is named `type` on the assumption that
# the field lands in ServiceConfig with that name; init ignores keys it does
# not know, so this is inert either way, and if the field arrives called
# something else these four lines are the ones to change.
[[services]]
name = "udev"
description = "Device manager: start udevd and coldplug attached hardware"
exec = "/usr/sbin/raven-udev"
args = []
type = "oneshot"
restart = false
enabled = true
critical = false

# Console font, before the gettys draw anything on tty1.
#
# restart = false makes this a one-shot: setfont loads the font into the console
# driver and exits, and there is nothing to supervise afterwards. It is not
# critical -- a console on the kernel's built-in font is ugly, not broken.
# `type = "oneshot"` is the declared half of that; see the note on udev above
# for why the two are not the same statement.
[[services]]
name = "console-font"
description = "Load the JetBrains Mono Nerd Font console font"
exec = "/usr/sbin/raven-console-font"
args = []
type = "oneshot"
restart = false
enabled = true
critical = false

# tty1: PAM-free rescue shell (avoids /bin/login issues during bring-up)
[[services]]
name = "getty-tty1"
description = "Getty login on tty1"
exec = "/sbin/agetty"
args = ["--noclear", "--skip-login", "--login-program", "/bin/raven-shell", "tty1", "linux"]
tty = "/dev/tty1"
restart = true
enabled = true
critical = false

# tty2: real login prompt (login(1) + PAM) for testing authentication
[[services]]
name = "getty-tty2"
description = "Getty login on tty2"
exec = "/sbin/agetty"
args = ["--login-program", "/sbin/login", "tty2", "linux"]
tty = "/dev/tty2"
restart = true
enabled = true
critical = false

# Syslog daemon (if available)
[[services]]
name = "syslogd"
description = "System logger"
exec = "/sbin/syslogd"
args = ["-n"]
restart = true
enabled = false  # Enable when syslogd is installed
critical = false

# Kernel log daemon (if available)
[[services]]
name = "klogd"
description = "Kernel logger"
exec = "/sbin/klogd"
args = ["-n"]
restart = true
enabled = false  # Enable when klogd is installed
critical = false

# D-Bus system bus (required by many services and GUI apps)
[[services]]
name = "dbus"
description = "D-Bus system message bus"
exec = "/usr/bin/dbus-daemon"
args = ["--system", "--nofork", "--nopidfile"]
# /run is a fresh tmpfs each boot and dbus-daemon does not mkdir its own
# socket directory -- without this it dies binding /run/dbus/system_bus_socket.
runtime_dirs = ["/run/dbus"]
after = ["udev"]
ready_path = "/run/dbus/system_bus_socket"
ready_timeout = 5
restart = true
enabled = true
critical = false

# cawd - CAW wireless daemon
#
# Owns the wifi interface: netlink to the kernel, WPA in-process, and its own
# DHCP client. It needs no D-Bus and no supplicant, and it creates /run/caw
# (the CLI socket) and /var/lib/caw/profiles (saved passphrases, 0700) itself
# on first start, so there is nothing to pre-create.
#
# It autoconnects: on start it scans and rejoins the strongest saved network,
# so this box comes back on the air after a reboot without anyone at the
# console. Only networks with a credential are eligible -- an open network
# authenticates nothing, so a saved one is a name anybody can broadcast.
# First join is still manual: `caw scan`, then `caw connect <ssid>`.
#
# Known gap, and it is ours rather than CAW's. `caw shutdown` is the graceful
# stop -- it deauthenticates, then removes the socket -- and upstream wires it
# as systemd's ExecStop=. raven-init has no per-service stop command: it sends
# SIGTERM, then SIGKILL, and /etc/raven/shutdown.d runs only after that, with
# cawd already dead. So a reboot still leaves the station on the air until the
# AP times it out. Nothing leaks -- /run is a tmpfs -- but the deauth is lost.
[[services]]
name = "cawd"
description = "CAW wireless daemon"
exec = "/usr/bin/cawd"
args = []
after = ["udev"]
# The unit's `RuntimeDirectory=caw`. Belt and braces rather than the fix:
# cawd's own mkdir of /run/caw succeeds, because /run always exists. Declared
# anyway so the runtime half of the contract is written down next to the
# service instead of living only in an upstream systemd file nothing here
# reads -- and so it keeps working if the socket path ever moves deeper.
runtime_dirs = ["/run/caw"]
# cawd answers on this socket once it is up; a client that connects earlier
# gets ECONNREFUSED, which the Settings network page used to see at boot.
ready_path = "/run/caw/caw.sock"
ready_timeout = 5
restart = true
enabled = true
critical = false
# The graceful stop. cawd cannot handle SIGTERM -- rustix exposes no safe
# signalfd and the crate forbids unsafe -- so it is stopped over its own
# socket, which deauthenticates from the AP before the socket goes away.
# raven-init runs this to completion, then falls through to SIGTERM either
# way. Upstream's systemd unit uses the same command as ExecStop=.
stop_exec = "/usr/bin/caw"
stop_args = ["shutdown"]
stop_timeout = 5

# Power button, sleep button and lid.
#
# The kernel turns all three into evdev events and stops there: it will not
# suspend on a lid close on its own, and nothing else in the base image is
# listening. raven-powerd reads them and asks init, over the same control
# socket `raven-rc suspend` uses, to do the one privileged thing involved --
# the write to /sys/power/state.
#
# after = udev because the devices it watches are /dev/input nodes udev
# creates. It rescans every ten seconds anyway, so a race here would cost a
# few seconds of a dead lid rather than a dead lid.
#
# Policy is /etc/raven/power.toml. With no such file the defaults are: power
# button suspends, sleep button suspends, closing the lid suspends.
[[services]]
name = "powerd"
description = "Power button, sleep button and lid switch"
exec = "/usr/bin/raven-powerd"
args = []
after = ["udev"]
# The desktop and raven-rc talk to powerd here; up means listening.
ready_path = "/run/raven-power/ctl"
ready_timeout = 5
restart = true
enabled = true
critical = false

# Keyboard backlight and fans.
#
# The kernel exposes both and drives neither on its own: the keyboard light is
# an LED-class device that comes up dark, and a fan taken off firmware control
# stays wherever it was last told to. raven-controlsd owns the writes and, more
# to the point, owns giving them back -- on exit, on a signal, on a panic and on
# a watchdog trip -- which is why fan control is a daemon here and not something
# the Controls window does for itself.
#
# Idle it writes nothing: it holds no channel until somebody asks for a curve or
# a manual speed. Saved curves are in /var/lib/raven-controls/state.json and are
# re-applied at boot. Its socket at /run/raven-controls/ctl is group video, like
# powerd's and timed's, which is how the Controls window asks.
[[services]]
name = "controlsd"
description = "Keyboard backlight and fan control"
exec = "/usr/bin/raven-controlsd"
args = []
after = ["udev"]
# Same for controlsd: the socket is the proof it is serving.
ready_path = "/run/raven-controls/ctl"
ready_timeout = 5
restart = true
enabled = true
critical = false

# The firewall, before anything can ask the network for an address.
#
# `nft -f` reads /etc/nftables.conf, hands the whole ruleset to the kernel in
# one atomic transaction and exits. The ruleset lives in the kernel afterwards,
# not in a process, so there is nothing to supervise: this is a one-shot, and
# `exited` in `raven-rc list` is what success looks like. That is the whole
# reason `type = "oneshot"` is written here as well as restart = false -- see
# the note on the udev service above for why the two are not the same
# statement.
#
# It is in THIS file rather than in configs/raven/services because of where it
# sits in the list, and that is not a filing preference. Drop-ins from
# /etc/raven/init.d are appended after init.toml's own services
# (init/src/config.rs:369-380), and start_services resolves `after` first but
# keeps configuration order as the tie-breaker (init/src/main.rs:1052-1058).
# So no template can be made to run before `network`, and `network` is
# raven-dhcp bringing up every wired link and taking an address. A firewall
# loaded after that point has left the machine addressable and unfiltered for
# the length of a DHCP exchange on whatever network it just joined -- a small
# window, but the one window a laptop opens in every unfamiliar place it is
# carried to. Putting the entry immediately above `network` closes it.
#
# after = ["udev"] for the module path: nf_tables and its expression modules
# are loaded on demand when nft asks for them, and the udev stage is what
# makes on-demand module loading work at all this early. The ruleset itself
# needs no hardware -- it names exactly one interface, `lo`, which exists
# before anything is probed. It names no other, deliberately: nft resolves an
# interface name to an index when the rule is loaded, so a rule mentioning the
# wifi or the dock would fail to load on a boot where that device is not
# plugged in yet.
#
# SHIPPED DISABLED, and it has to be, for three reasons that will not go away
# in the same commit. There is no nft binary in the image (nftables is in the
# repositories as extra/nftables and is not staged). The kernel does not
# support nftables: configs/kernel/config-6.17-raven still says
# `# CONFIG_NF_TABLES is not set`, so `nft -f` would fail on any ruleset at
# all. And scripts/check-desktop-image.py requires the exec of every ENABLED
# service to exist in the image, so enabling this before the binary is staged
# fails the build rather than the boot. Once all three are settled:
#
#   raven-rc start nftables     # load the ruleset now
#   raven-rc enable nftables    # load it at every boot
#
# critical = false is a deliberate choice against the instinct. A critical
# service that fails takes the boot down with it, and a machine that will not
# boot is not a machine that failed closed -- it is a machine its owner boots
# from a USB stick to fix, with the firewall no more loaded than before. So a
# failure here leaves the system up and unfiltered, which means the failure
# must be visible: `raven-rc status nftables` carries the exit status, and
# /var/log/raven/nftables.log carries nft's own complaint about whichever line
# of the ruleset it refused.
[[services]]
name = "nftables"
description = "Firewall: load the ruleset from /etc/nftables.conf"
exec = "/usr/bin/nft"
args = ["-f", "/etc/nftables.conf"]
after = ["udev"]
type = "oneshot"
restart = false
enabled = false
critical = false

# Network manager (when available)
#
# Still handles wired interfaces at boot. cawd runs DHCP itself on the links it
# brings up, but only after `caw connect`, so the two do not race: by the time
# cawd touches the wifi interface this has long since finished.
#
# A one-shot, and one whose exit is easy to misread: raven-dhcp configures
# every wired link it finds and returns, leaving the dhcpcd it started
# behind as a child of init in no roster at all. So this service being
# `exited` means the addresses are up, not that networking stopped -- which
# is precisely the confusion `type = "oneshot"` exists to end.
[[services]]
name = "network"
description = "Network management"
exec = "/bin/raven-dhcp"
args = ["--all", "-q"]
after = ["udev"]
type = "oneshot"
restart = false
enabled = true
critical = false

# The clock: NTP sync and the timezone.
#
# init reads the RTC at boot and stops there; nothing else in the image ever
# asks the network whether that reading was right, and nothing unprivileged
# can move /etc/localtime. raven-timed does both, and its socket at
# /run/raven-time/ctl (group video, like powerd's) is how the Settings app's
# Date & Time page and the `raven-timed` CLI ask.
#
# No `after = network`, deliberately: the first sync would like the network,
# but raven-rc treats `after` as a dependency it must start, and a machine
# without raven-dhcp would then have no clock daemon at all. The daemon backs
# off and retries on its own, so starting before there is a default route
# costs the first attempt and nothing else.
#
# Policy is /etc/raven/time.toml. With no such file the defaults are: sync on,
# against pool.ntp.org, every hour.
[[services]]
name = "timed"
description = "Clock sync and timezone"
exec = "/usr/bin/raven-timed"
args = []
after = []
runtime_dirs = ["/run/raven-time"]
# timed listens here before its first sync attempt, so ready is quick.
ready_path = "/run/raven-time/ctl"
ready_timeout = 5
restart = true
enabled = true
critical = false

# The fingerprint sensor.
#
# There is no libfprint on this image and no fprintd on the bus, for the reason
# there is no wpa_supplicant: the stack under the one operation that has to work
# when everything else has gone wrong should not be the largest C dependency on
# the machine. raven-fprintd is the whole of it -- it talks to the reader over
# usbfs and answers one question, which stored finger is on the sensor right
# now. It cannot unlock anything; ravend decides what a match is worth.
#
# Started on every machine, including the ones with no reader. A daemon that
# refused to run without hardware could not answer "there is no reader", and the
# settings panel would instead find a missing socket and have to guess. It opens
# the device lazily, so on a machine with none this costs a socket and a few
# kilobytes of resident memory.
#
# after = udev because the node it opens is under /dev/bus/usb. It looks again
# on every request, so a reader that appears late -- or a race with udev -- costs
# one request and not a restart.
#
# Its socket is root-only: unlike the lock screen's verify socket, which any
# session may use because it only ever checks a password against the *asker's
# own* account, this one reports matches without being told whose they are.
[[services]]
name = "fprintd"
description = "Fingerprint reader"
exec = "/usr/bin/raven-fprintd"
args = []
after = ["udev"]
runtime_dirs = ["/run/raven-fprint"]
# The socket is the proof it is serving; it binds before opening any device.
ready_path = "/run/raven-fprint/sensor.sock"
ready_timeout = 5
restart = true
enabled = true
critical = false

# Removable storage: a drive that arrives after boot.
#
# Everything below the device node was already there -- USB storage, vfat,
# exfat, ntfs3 -- and nothing turned it into a directory, so plugging in a
# stick produced a /dev/sdb1 and a file manager showing nothing. This watches
# the same uevent socket raven-ports does and mounts what it recognises under
# /media, nosuid and nodev, owned by whoever the session runs as. It is also
# `raven-mount list` and `raven-mount unmount`, when run by hand.
#
# Not udisks2: that answers to polkit, which this system does not run (see the
# note further down). The decision -- is this removable, and is the system
# using the disk it is on -- is the whole of what was missing.
[[services]]
name = "mount"
description = "Removable storage: mount USB drives and cards under /media as they arrive"
exec = "/usr/bin/raven-mount"
args = ["watch", "--automount"]
after = ["udev"]
restart = true
enabled = true
critical = false

# Ports: hotplug after boot.
#
# The network service above is a one-shot, so a cable plugged in later -- or
# the NIC in a dock -- got no lease. This watches link state over rtnetlink
# and runs the same raven-dhcp invocation when a wired link comes up. It is
# also `raven-ports list`, the port and peripheral inventory, when run by hand.
[[services]]
name = "ports"
description = "Port hotplug: DHCP for wired links that come up after boot"
exec = "/usr/bin/raven-ports"
args = ["watch", "--react"]
after = ["udev", "network"]
restart = true
enabled = true
critical = false

# polkitd is no longer started. It ran for two years without a caller: no
# Raven component asks PolicyKit for anything (the store and settings never
# did, and now escalate through rvnd or a visible terminal), no installed
# package depends on the polkit package, and no session runs an
# authentication agent, so a prompt could not have been answered anyway. A
# policy daemon nobody consults is a root process for nothing. The package is
# no longer staged either; `rvn install polkit` and a drop-in bring it back
# for a machine that wants pkexec.
