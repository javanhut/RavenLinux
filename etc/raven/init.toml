# Additional mount points (beyond the essential ones)
# =============================================================================

# Example: Mount /home partition
# [[mounts]]
# source = "LABEL=HOME"
# target = "/home"
# fstype = "ext4"
# options = "defaults,noatime"
# mount_at_boot = true

# Example: Mount NFS share
# [[mounts]]
# source = "server:/export/data"
# target = "/mnt/data"
# fstype = "nfs"
# options = "rw,soft"
# mount_at_boot = false
