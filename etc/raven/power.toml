# RavenLinux power policy
# /etc/raven/power.toml
#
# What the power button, the sleep button and the lid do. Read by raven-powerd
# at start; edit and `raven-rc restart powerd` to apply.
#
# Every setting takes one of five values:
#
#   suspend    sleep to RAM. The machine wakes on the power button or the lid.
#   hibernate  write the session to swap and power off, resuming at next boot.
#   poweroff   orderly shutdown, then power off.
#   reboot     orderly shutdown, then reboot.
#   ignore     do nothing at all.
#
# `hibernate` needs somewhere to write the image and something to read it back:
# a swap device at least as large as the memory in use, and a `resume=` on the
# kernel command line naming it. raven-install writes that line for any machine
# it gives swap to. raven-init checks before it writes, so a machine that
# cannot resume refuses to hibernate and says so in the log rather than powering
# off and losing the session -- which means a lid set to "hibernate" on a
# machine with no swap does nothing at all, quietly. A machine booted with
# `noresume`, which is every snapshot entry raven-snapshot writes, refuses for
# the same reason.
#
# The [profile] section is different: it is not about buttons but about how
# hard the CPU runs, on mains and on battery. See below.
#
# There is nothing here about waking. Waking happens in firmware, before any of
# this is running: raven-powerd arms the power button, the sleep button and the
# lid as ACPI wakeup sources when it starts, and after that pressing the power
# button or opening the lid brings the machine back with no policy involved.

[buttons]
# The power button. Sleep rather than power off, because on a laptop that
# button is a "put this down for an hour" button far more often than a "shut
# this down" one -- and holding it for four seconds still cuts the power in
# firmware, which is the escape hatch that makes this the safe default.
power = "suspend"

# The dedicated sleep button, where there is one: the moon key on a laptop's
# function row, or ACPI's PNP0C0E.
sleep = "suspend"

[lid]
# Closing the lid. Set this to "ignore" for a machine that lives shut on a
# desk with an external monitor, or to "hibernate" for one that spends the day
# in a bag -- a suspended laptop drains over several hours, a hibernated one
# does not.
close = "suspend"

# Arm the buttons and the lid as ACPI wakeup sources at start.
#
# Leave this on unless you are managing /proc/acpi/wakeup by hand: a lid that
# sleeps the machine and cannot wake it is worse than one that does nothing.
# Keyboards are never armed, even though a laptop keyboard claims to have a
# power key -- an i8042 armed to wake is a classic cause of a machine that
# resumes one second after it suspends.
manage_wakeup = true

# =============================================================================
# CPU and platform power policy
# =============================================================================
#
# The kernel picks a frequency governor at boot and never looks at whether the
# cord is plugged in. raven-powerd does: it reads /sys/class/power_supply every
# few seconds and puts the machine in one of three presets, the same three
# power-profiles-daemon made familiar:
#
#   performance    every core at its top clock; the platform's performance mode.
#   balanced       scale with load (schedutil, or the firmware's balanced
#                  energy-performance preference); the platform's default mode.
#   power-saver    scale with load, leaning lower; the platform's low-power mode;
#                  PCIe links allowed to sleep; audio codec powers down when idle.
#
# None of the presets caps the maximum frequency, turns off turbo or takes
# cores offline: a build still gets every core at full speed on battery. What
# they change is how eagerly the machine idles down between bursts, which is
# where nearly all the battery goes.
#
# Which knobs exist depends on the CPU: Intel and newer AMD expose an
# energy-performance preference and the preset goes there; older AMD and
# anything on acpi-cpufreq gets the schedutil governor. raven-powerd works out
# which it has.
#
# What each preset actually writes, which until now was recorded only in
# init/src/profile.rs and therefore only legible to somebody reading Rust:
#
#                         performance      balanced              power-saver
#   ---------------------------------------------------------------------------
#   governor, with EPP    performance      powersave             powersave
#   EPP                   performance      balance_performance   balance_power
#   governor, no EPP      performance      schedutil             schedutil
#   platform_profile      performance      balanced              low-power
#   PCIe ASPM policy      firmware default firmware default      powersave
#   snd_hda_intel idle    0 (stay awake)   0 (stay awake)        10 seconds
#
# Reading the table:
#
# `governor, with EPP` looks wrong and is not. On a CPU with an
# energy-performance preference the firmware chooses the frequency and
# `powersave` is the governor that lets it -- it is the name of "hand the
# decision to the hardware", not the name of "go slowly". The preference beside
# it is the actual policy. On performance the governor is pinned instead,
# because there the point is to stop anything below from choosing at all.
#
# `governor, no EPP` is the fallback for older AMD and acpi-cpufreq. Each cell
# is the first governor the kernel offers from an ordered list, so a kernel
# without schedutil gets ondemand, then conservative, then -- for balanced and
# power-saver only, and only when nothing that scales exists -- performance. A
# pinned top clock is at least honest. `userspace` is never chosen under any
# preset: it is the same pinned clock waiting for a daemon that is not coming.
#
# `platform_profile` is the vendor's own switch -- the file
# /sys/firmware/acpi/platform_profile -- and it is where the fans and the
# power limits live. Only a value the firmware
# lists is written, so each preset has an ordered preference and takes the
# first match: performance falls back to balanced-performance and then to
# balanced; balanced falls back to balanced-performance; power-saver tries
# low-power, then the name Lenovo and others use for it, `quiet`, then
# balanced. A machine whose firmware offers none of them keeps whatever it
# booted with, and the governor half above still applies.
#
# The last two rows are power-saver's alone. Letting idle PCIe links drop to L1
# saves real power on battery and costs a latency nobody notices; keeping the
# HDA codec awake on mains avoids the pop some codecs make coming back, which
# is a thing you hear every time rather than a number on a graph.
#
# None of this is symmetrical with what the preset does NOT do, which is worth
# repeating because `performance` sounds like it should: it does not raise a
# power limit past the firmware's, unlock turbo that firmware has capped, or
# change a thermal target. It stops the machine idling down between bursts and
# asks the platform for its performance mode. On a laptop that is largely a
# decision about fan noise and skin temperature.
#
# `ac = "performance"` is a valid value today and always has been -- the preset
# exists in raven-powerd, it is only not the shipped default. If you change
# what ships here, note that init/src/profile.rs has a test asserting the
# shipped file's ac and battery presets by name, and it fails the build on the
# next line rather than at the next boot.
[profile]
# Set to false to leave the governor alone, if you run TLP or something else
# for this.
#
# Whatever this says, the desktop can hold the machine in one preset for the
# session -- `profile <preset>` on /run/raven-power/ctl, `profile auto` to
# hand the choice back -- and the preset last applied is readable at
# /run/raven-power/profile. Overrides do not survive a restart of the daemon.
manage = true

# On mains, and always on a machine with no battery.
ac = "balanced"

# On battery. "balanced" here gives a little more sustained speed for a little
# less runtime; "power-saver" is the right call for most laptops.
battery = "power-saver"
