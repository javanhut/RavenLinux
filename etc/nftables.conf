#!/usr/bin/nft -f
#
# RavenLinux firewall policy
# /etc/nftables.conf
#
# Loaded once at boot by the `nftables` one-shot in /etc/raven/init.toml,
# which runs `nft -f /etc/nftables.conf` before the network comes up. Edit and
# `raven-rc restart nftables` to apply -- the `flush ruleset` on the first line
# makes that safe to do as often as you like.
#
# The shebang is not how this file is normally run; it is there so that
# `./nftables.conf` works while you are testing one, and nft reads the line as
# a comment when it is given the file with -f.
#
# THIS FILE DOES NOTHING ON A KERNEL WITHOUT NF_TABLES. As it is written, the
# shipped kernel config says `# CONFIG_NF_TABLES is not set` and there is no
# nft binary in the image either, so the service that loads it ships disabled
# and nothing here is in force. Turning it on needs, in order: CONFIG_NF_TABLES
# and CONFIG_NF_TABLES_INET in configs/kernel/config-6.17-raven, plus
# CONFIG_NFT_CT for the `ct state` rules below (without it this ruleset does
# not load at all, not merely lose a rule); the nftables package staged into
# the image; then `raven-rc enable nftables`. CONFIG_NFT_LOG and
# CONFIG_NFT_LIMIT are wanted only by the commented-out logging rule at the
# end, which is why it is commented out -- the ruleset that ships loads with
# the smallest set of options that can express it.
#
# The shape of the policy, in one paragraph, because it is a decision and not
# a default: inbound is denied unless a rule allows it, outbound is not
# filtered at all. This is a laptop. It initiates connections; it does not
# serve. Filtering what leaves the machine would mean maintaining a list of
# every program allowed to talk to the internet, which on a desktop degrades
# within a week into a list ending in "accept everything else" -- with the
# difference that now it looks like there is an egress policy. A bastion or a
# server is a different machine and deserves a different file.
#
# What is deliberately not here: NAT and forwarding (Raven routes nothing by
# default -- see the forward chain), rate limiting, port knocking, and any
# per-application rule. Kernel-level anti-spoofing is not here either; it is
# net.ipv4.conf.all.rp_filter in /usr/lib/sysctl.d/50-raven.conf, which runs
# before any of this and is cheaper than a rule.

flush ruleset

table inet filter {

	# One inet table covers IPv4 and IPv6 in the same chains. Two families
	# meant two rulesets, and two rulesets meant the IPv6 one was the one
	# that got forgotten -- which is the interesting half, because IPv6 has
	# no NAT in front of it to hide behind.
	chain input {
		type filter hook input priority filter; policy drop;

		# The rule that makes default-deny survivable, and the reason it
		# is first: almost every packet this machine legitimately
		# receives is an answer to something it sent. Conntrack matches
		# those without any rule naming a port, so the rest of this
		# chain only has to describe traffic that arrives unsolicited.
		# `related` is what lets an ICMP error about one of our own
		# connections back in -- see the ICMP section for why that
		# matters more than it sounds.
		ct state established,related accept

		# Loopback, unconditionally. Everything on this machine that is
		# not a unix socket is here: the session D-Bus bus, CUPS on
		# 631, whatever a development server is bound to this afternoon.
		# A default-drop input chain without this rule is a machine that
		# looks broken in a hundred unrelated ways at once.
		#
		# Nothing on lo needs a source check: the rp_filter setting in
		# 50-raven.conf already drops a packet claiming a loopback
		# address that arrives on a real interface.
		#
		# `lo` is the only interface this file names, and that is a
		# constraint rather than an accident: `iif` resolves a name to a
		# kernel interface index when the ruleset is loaded, so a rule
		# naming the wifi or the dock's NIC fails to load on a boot
		# where that device is not present -- and this ruleset is loaded
		# before the network is up. A rule that must name a real
		# interface should use `iifname` instead, which compares the
		# name at match time and tolerates the device appearing later.
		iif "lo" accept

		# Packets conntrack cannot place in any flow. Dropping them
		# explicitly rather than letting them fall to the policy keeps
		# them out of the counters below and out of any log rule, where
		# they are noise: on a laptop that suspends, resumes and changes
		# networks, `invalid` is mostly the tail of connections whose
		# conntrack entries died while the machine was asleep.
		ct state invalid drop

		# ---------------------------------------------------------------
		# ICMP -- not optional, and the most common way a hand-written
		# firewall breaks a network without looking like it did.
		# ---------------------------------------------------------------
		#
		# IPv4: destination-unreachable carries the fragmentation-needed
		# message that path MTU discovery is built on. Drop it and
		# connections over a link with a smaller MTU -- a VPN, PPPoE, a
		# tunnel -- complete their handshake and then hang forever on
		# the first full-size packet, which reads as "big pages don't
		# load" and never as "the firewall". time-exceeded is what makes
		# traceroute work. parameter-problem is rare and cheap.
		#
		# echo-request is answered on purpose. A machine that does not
		# answer ping is not harder to find -- anything scanning found
		# it by other means -- it is only harder to diagnose, and the
		# person diagnosing it is nearly always the person who owns it.
		meta l4proto icmp icmp type {
			echo-request,
			destination-unreachable,
			time-exceeded,
			parameter-problem
		} accept

		# IPv6: the same reasoning, and then some. ICMPv6 is not a
		# diagnostic protocol there, it is part of the stack. Neighbour
		# discovery replaces ARP, router advertisements are how the
		# machine gets an address and a default route at all, and
		# packet-too-big is mandatory because IPv6 routers do not
		# fragment -- PMTU discovery is the only mechanism there is.
		# The multicast listener messages are how the machine joins the
		# groups the two rules above and mDNS below depend on.
		#
		# A firewall that drops ICMPv6 produces a machine where IPv6
		# half-works: DNS resolves to AAAA records, connections open,
		# and then transfers stall at random sizes on random sites,
		# while ping and traceroute look fine. That failure has cost
		# more engineer-days than every port this chain closes.
		meta l4proto ipv6-icmp icmpv6 type {
			echo-request,
			destination-unreachable,
			packet-too-big,
			time-exceeded,
			parameter-problem,
			mld-listener-query,
			mld-listener-report,
			mld-listener-done,
			mld2-listener-report,
			nd-router-solicit,
			nd-router-advert,
			nd-neighbor-solicit,
			nd-neighbor-advert
		} accept

		# ---------------------------------------------------------------
		# Getting an address
		# ---------------------------------------------------------------
		#
		# DHCPv4: the server answers from its port 67 to our port 68.
		# The opening exchange of a lease does not depend on this rule
		# -- a client with no address yet cannot use a normal socket, so
		# dhcpcd does discovery on a packet socket, underneath netfilter
		# entirely -- which is exactly why a missing rule here is so
		# unpleasant to diagnose: the machine boots with an address and
		# looks fine. Renewals are the part that can arrive as ordinary
		# UDP, and a renewal dropped in silence is a machine that loses
		# its address hours into an otherwise unremarkable session.
		udp sport 67 udp dport 68 accept

		# DHCPv6, and stateless DHCPv6 for DNS servers when the network
		# hands out addresses by router advertisement. Replies arrive at
		# our link-local address, so requiring fe80::/10 as the
		# destination costs nothing and keeps the port from being open
		# to the routed internet.
		ip6 daddr fe80::/10 udp sport 547 udp dport 546 accept

		# ---------------------------------------------------------------
		# mDNS -- a decision, taken here rather than inherited
		# ---------------------------------------------------------------
		#
		# The situation as found: avahi-daemon ships enabled
		# (configs/raven/services/avahi-daemon.toml) and is listening on
		# 0.0.0.0:5353 and [::]:5353 right now, and the printing stack
		# is built around it -- a driverless printer is discovered over
		# mDNS or it is not discovered at all. Closing 5353 would leave
		# an enabled daemon that can announce and never hear an answer,
		# which is the worst of the three options: printing quietly
		# stops working and the daemon still holds the port.
		#
		# So it is open, and scoped. Both rules below require the
		# destination to be the mDNS group address -- 224.0.0.251 or
		# ff02::fb -- and both of those are link-scope by definition:
		# 224.0.0.0/24 and ff02::/16 are never forwarded by any router,
		# so nothing off this network segment can reach avahi through
		# them. That is what "link-local scope only" can honestly mean
		# here; it cannot mean a link-local source address, because
		# every real mDNS speaker sends from its ordinary subnet
		# address.
		ip daddr 224.0.0.251 udp dport 5353 accept
		ip6 daddr ff02::fb udp dport 5353 accept

		# The unicast half, and the looser of the two. When this machine
		# asks a question with the unicast-response bit set, the answer
		# comes straight back to its own address -- and conntrack does
		# not recognise it, because the request went to a multicast
		# address and the reply tuple does not match. Requiring 5353 on
		# both ends is what keeps this narrow: it admits an answer from
		# another mDNS responder, and not a legacy unicast query from an
		# arbitrary port, which is the shape that lets a stranger on the
		# network interrogate avahi directly.
		#
		# The hop count is what scopes it, and it is not a trick: RFC
		# 6762 requires every mDNS message, multicast or unicast, to be
		# sent with a TTL or hop limit of 255, precisely so that a
		# responder can tell an on-link message from a forwarded one.
		# Every router in the path decrements it, so a packet that still
		# reads 255 has crossed no router and came from this segment.
		# The two multicast rules above do not need the test -- their
		# destination addresses are never forwarded by anything -- but
		# without it here, `sport 5353 dport 5353` would be reachable
		# from the routed internet over IPv6, where there is no NAT in
		# the way.
		#
		# Delete these two lines if you would rather have discovery that
		# works only when the responder answers by multicast, which is
		# most of the time but not all of it.
		ip ttl 255 udp sport 5353 udp dport 5353 accept
		ip6 hoplimit 255 udp sport 5353 udp dport 5353 accept

		# CUPS is deliberately NOT opened. Printing to a network printer
		# is an outbound connection to its port 631, which the accept on
		# established handles; the only thing an inbound 631 would add
		# is sharing this machine's printers with the network. That is a
		# decision somebody should make on purpose:
		#
		#   tcp dport 631 accept    # share printers from this machine
		#
		# The same goes for ssh, for the same reason it ships disabled
		# in configs/raven/services/sshd.toml -- installing a daemon is
		# not a decision to expose it:
		#
		#   tcp dport 22 accept     # accept ssh from the network

		# Everything else falls to `policy drop`. Uncomment to find out
		# what that is; both rules need CONFIG_NFT_LOG and
		# CONFIG_NFT_LIMIT, and the rate limit is not optional -- an
		# unlimited log rule on a busy network is how a laptop fills its
		# root filesystem overnight.
		#
		#   limit rate 5/minute burst 10 packets log prefix "nft-drop: " level info
		#   counter
	}

	# Raven routes nothing. This machine is not a gateway, and a laptop that
	# forwards packets between the wifi it is on and the dock it is plugged
	# into is a bridge somebody built by accident.
	#
	# The case that will want changing: containers and virtual machines.
	# Anything that puts a guest behind a bridge or a veth pair needs its
	# traffic forwarded, and the tools that set that up normally install
	# their own table at a different priority rather than editing this
	# chain. If a container has network access before this file loads and
	# none afterwards, this chain is the first place to look.
	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	# Outbound is not filtered; see the paragraph at the top of the file.
	# The chain exists anyway so that the policy is written down where
	# somebody looking for it will find it, rather than being the absence
	# of a chain.
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
