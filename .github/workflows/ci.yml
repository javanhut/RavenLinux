# =============================================================================
# RavenLinux CI Workflow
# =============================================================================
# Quick CI checks for pull requests and commits
# Does NOT build the kernel or ISO (that's in build.yml for releases)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Rust Checks
  # ===========================================================================
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-uefi

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check raven-init
        run: cargo check --release
        working-directory: init

      - name: Clippy raven-init
        run: cargo clippy --release -- -W warnings
        working-directory: init
        continue-on-error: true

      - name: Check bootloader
        run: cargo check --release --target x86_64-unknown-uefi
        working-directory: bootloader

  # ===========================================================================
  # Build Test
  # ===========================================================================
  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: rust-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build raven-init
        run: cargo build --release
        working-directory: init

      - name: Build bootloader
        run: cargo build --release --target x86_64-unknown-uefi
        working-directory: bootloader

      - name: Report binary sizes
        run: |
          echo "## Binary Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| raven-init | $(du -h init/target/release/raven-init | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| raven-rc | $(du -h init/target/release/raven-rc | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| raven-boot.efi | $(du -h bootloader/target/x86_64-unknown-uefi/release/raven-boot.efi | cut -f1) |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Shell Script Checks
  # ===========================================================================
  shellcheck:
    name: Shell Script Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          find scripts -name "*.sh" -type f | xargs shellcheck -S warning || true
        continue-on-error: true
