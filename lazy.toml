# RavenLinux's canonical build interface. The Makefile is only a compatibility
# shim for existing automation; new documentation and development use ImLazy.

[settings]
default = "help"

[variables]
image = "ravenlinux-build"
engine = ""
jobs = "$(nproc)"
arch = "x86_64"
run = "RAVEN_IMAGE='{{image}}' RAVEN_ENGINE='{{engine}}' ./scripts/docker-build.sh"
flags = "-j {{jobs}} -a {{arch}}"
rootfs_image = "ravenlinux:latest"

[commands.help]
desc = "Show RavenLinux build commands"
run = ["imlazy list"]

[commands.image]
desc = "Build the containerized RavenLinux build environment"
run = ["{{run}} image"]

[commands.build]
desc = "Build RavenLinux and produce the ISO"
run = ["{{run}} {{flags}} all"]
alias = ["all"]

[commands.rebuild]
desc = "Discard cached output and perform a complete build"
run = ["{{run}} {{flags}} --clean all"]

[commands.rootfs]
desc = "Package the built sysroot as a container image"
run = ["RAVEN_IMAGE='{{image}}' RAVEN_ENGINE='{{engine}}' RAVEN_ROOTFS_IMAGE='{{rootfs_image}}' ./scripts/export-rootfs.sh"]

[commands.stage0]
desc = "Build the musl cross toolchain"
run = ["{{run}} {{flags}} stage0"]

[commands.stage1]
desc = "Cross-build the base system, kernel, and initramfs"
run = ["{{run}} {{flags}} stage1"]

[commands.stage2]
desc = "Populate the native runtime sysroot"
run = ["{{run}} {{flags}} stage2"]

[commands.stage3]
desc = "Build base libraries, shells, OpenSSH, and RavenBoot"
run = ["{{run}} {{flags}} stage3"]

[commands.raven]
desc = "Build the Raven application layer"
run = ["{{run}} {{flags}} raven"]

[commands.gui]
desc = "Build Huginn and the Raven graphical session"
run = ["{{run}} {{flags}} gui"]

[commands.iso]
desc = "Regenerate the ISO from the existing sysroot"
run = ["{{run}} {{flags}} stage4"]
alias = ["stage4"]

[commands.initramfs]
desc = "Rebuild only the early userspace image"
run = ["{{run}} {{flags}} initramfs"]

[commands.test]
desc = "Run init, installer, and console-font tests"
run = [
  "cargo test --manifest-path init/Cargo.toml",
  "./scripts/installer/test-raven-install.sh",
  "./scripts/test-console-font.sh",
]

[commands.qemu]
desc = "Boot the ISO on a serial console"
run = ["./scripts/test-qemu.sh --console"]

[commands.qemu-uefi]
desc = "Boot the ISO through UEFI firmware"
run = ["./scripts/test-qemu.sh --console --uefi"]

[commands.qemu-desktop]
desc = "Boot the Huginn desktop with a virtio GPU"
run = ["./scripts/test-qemu.sh --desktop"]

[commands.smoke]
desc = "Run an unattended serial boot smoke test"
run = ["./scripts/test-qemu.sh --console --timeout 180"]

[commands.shell]
desc = "Open a shell in the build environment"
run = ["{{run}} shell"]

[commands.clean]
desc = "Remove build output"
run = ["./scripts/clean-build.sh"]

[commands.clean-image]
desc = "Remove the containerized build environment"
run = ["RAVEN_IMAGE='{{image}}' RAVEN_ENGINE='{{engine}}' ./scripts/clean-image.sh"]

[commands.distclean]
desc = "Remove build output and the build image"
dep = ["clean", "clean-image"]
