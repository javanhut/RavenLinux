# Generated by imlazy migrate from Makefile

[settings]
default = "make_help"

[variables]
image = "ravenlinux-build"
engine = ""
jobs = ""
arch = ""
docker_build = "./scripts/docker-build.sh"
env = "RAVEN_IMAGE='{{image}}' $(if $(strip {{engine}}),RAVEN_ENGINE='{{engine}}',)"
run = "{{env}} {{docker_build}}"
build_flags = "$(if $(strip {{jobs}}),-j {{jobs}},) $(if $(strip {{arch}}),-a {{arch}},)"
rootfs_image = "ravenlinux:latest"

[commands]

[commands.image]
desc = "Build the container toolchain image only"
run = ["{{run}} image"]

[commands.build]
desc = "Build everything and generate the ISO (-> repo root)"
run = ["{{run}} {{build_flags}} all"]

[commands.all]
desc = "Alias for build"
run = ["{{run}} {{build_flags}} all"]

[commands.rebuild]
desc = "Clean rebuild from scratch (wipes build/, then builds all)"
run = ["{{run}} {{build_flags}} --clean all"]

[commands.rootfs]
desc = "Package the sysroot as a container image"
run = ["{{env}} RAVEN_ROOTFS_IMAGE='{{rootfs_image}}' ./scripts/export-rootfs.sh"]

[commands.stage0]
desc = "musl cross-compilation toolchain"
run = ["{{run}} {{build_flags}} stage0"]

[commands.stage1]
desc = "Base system cross-built with that toolchain; kernel, initramfs"
run = ["{{run}} {{build_flags}} stage1"]

[commands.stage2]
desc = "Native rebuild of the sysroot: shells, utilities, libraries"
run = ["{{run}} {{build_flags}} stage2"]

[commands.stage3]
desc = "Base packages: core libraries, shells, OpenSSH"
run = ["{{run}} {{build_flags}} stage3"]

[commands.raven]
desc = "Raven layer: ravenshell, rvn, poxy, ivaldi, crow, imlazy, oxigen, caw"
run = ["{{run}} {{build_flags}} raven"]

[commands.gui]
desc = "Compositor and shell: huginn, muninn, muninn-lock"
run = ["{{run}} {{build_flags}} gui"]

[commands.stage4]
desc = "Squashfs root, bootloaders, bootable ISO"
run = ["{{run}} {{build_flags}} stage4"]

[commands.iso]
desc = "Alias for stage4"
run = ["{{run}} {{build_flags}} stage4"]

# Host-side tests. These do NOT go through the container: they check this
# repo's own Rust sources, not the distribution being built, so they need
# nothing but cargo and run in seconds.
#
# parse_shipped_config guards the one failure with no recovery path -- an
# /etc/raven/init.toml that raven-init cannot deserialize is a machine that
# does not boot, and the schema and the config live in separate files that are
# easy to change apart. It asserts both shipped configs parse, that cawd keeps
# its stop_exec hook, that a service without stop fields still gets
# stop_timeout = 5 from serde rather than 0, and that iwd stays disabled where
# it would otherwise fight cawd for the wiphy.
[commands.test]
desc = "Run the host-side Rust tests (init config schema)"
run = ["cargo test --manifest-path init/Cargo.toml"]

# Boot a built ISO. Host-side like `test`: QEMU runs on the host, not inside
# the build container, which has no display and no /dev/kvm.
#
# `qemu` is the serial-console boot -- works headless and captures the whole
# boot as text. `qemu-desktop` needs a display backend (qemu-ui-gtk) and gives
# Huginn a virtio GPU to take DRM master on; the emulated VGA QEMU defaults to
# offers no DRM device, so the compositor cannot start without it.
[commands.qemu]
desc = "Boot the built ISO in QEMU (serial console)"
run = ["./scripts/test-qemu.sh --console"]

[commands.qemu-desktop]
desc = "Boot the ISO with a GPU, for the Huginn Wayland session"
run = ["./scripts/test-qemu.sh --desktop"]

[commands.qemu-uefi]
desc = "Boot the ISO through OVMF (UEFI) on the serial console"
run = ["./scripts/test-qemu.sh --console --uefi"]

[commands.smoke]
desc = "Boot the ISO for 180s and exit (unattended check)"
run = ["./scripts/test-qemu.sh --console --timeout 180"]

[commands.shell]
desc = "Open an interactive shell inside the build container"
run = ["{{run}} shell"]

[commands.clean]
desc = "Remove host build artifacts (build/)"
run = [
  "echo \">> Removing build artifacts in ./build ...\"",
  "rm -rf build 2>/dev/null || { echo \"!! Some artifacts are root-owned (created by the privileged container).\"; echo \"!! Remove them with: sudo rm -rf build\"; exit 1; }",
  "echo \">> Done.\"",
]

[commands.clean-image]
desc = "Remove the container toolchain image"
run = [
  "echo \">> Removing image '{{image}}' ...\"",
  "{ command -v docker >/dev/null 2>&1 && docker rmi -f '{{image}}'; } || { command -v podman >/dev/null 2>&1 && podman rmi -f '{{image}}'; } || echo \"!! No docker/podman found, or image not present.\"",
]

[commands.distclean]
desc = "Remove build artifacts AND the toolchain image"
dep = ["clean", "clean-image"]

[commands.make_help]
desc = "Show this help"
run = [
  "echo \"RavenLinux build (containerized -- runs on macOS, Windows, or Linux)\"",
  "echo \"\"",
  "echo \"Usage: make <target> [JOBS=N] [ARCH=x86_64] [ENGINE=docker|podman] [IMAGE=tag]\"",
  "echo \"\"",
  "echo \"Targets:\"",
  "grep -E '^[a-zA-Z0-9 _-]+:.*?## .*$$' {{makefile_list}} | sort | awk 'BEGIN {FS = \":.*?## \"}; {printf \" \\033[36m%-13s\\033[0m %s\\n\", $$1, $$2}'",
]

# Migration warnings:
# - GNU make function in: RAVEN_IMAGE='$(IMAGE)' $(if $(strip $(ENGINE)),RAVEN_ENGINE='$(ENGINE)',)
# - GNU make function in: $(if $(strip $(JOBS)),-j $(JOBS),) $(if $(strip $(ARCH)),-a $(ARCH),)
