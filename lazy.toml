# Generated by imlazy migrate from Makefile

[settings]
default = "make_help"

[variables]
image = "ravenlinux-build"
engine = ""
jobs = ""
arch = ""
docker_build = "./scripts/docker-build.sh"
env = "RAVEN_IMAGE='{{image}}' "
run = "{{env}} {{docker_build}}"
build_flags = " "
rootfs_image = "ravenlinux:latest"

# Referenced but never assigned in the source; empty by default,
# as in make. Override at run time: imlazy <command> name=value
makefile_list = ""

[commands]

[commands.image]
run = ["{{run}} image"]

[commands.build]
run = ["{{run}} {{build_flags}} all"]

[commands.all]
run = ["{{run}} {{build_flags}} all"]

[commands.rebuild]
run = ["{{run}} {{build_flags}} --clean all"]

[commands.rootfs]
run = ["{{env}} RAVEN_ROOTFS_IMAGE='{{rootfs_image}}' ./scripts/export-rootfs.sh"]

[commands.stage0]
run = ["{{run}} {{build_flags}} stage0"]

[commands.stage1]
run = ["{{run}} {{build_flags}} stage1"]

[commands.stage2]
run = ["{{run}} {{build_flags}} stage2"]

[commands.stage3]
run = ["{{run}} {{build_flags}} stage3"]

[commands.raven]
run = ["{{run}} {{build_flags}} raven"]

[commands.gui]
run = ["{{run}} {{build_flags}} gui"]

[commands.stage4]
run = ["{{run}} {{build_flags}} stage4"]

[commands.iso]
run = ["{{run}} {{build_flags}} stage4"]

[commands.initramfs]
run = ["{{run}} {{build_flags}} initramfs"]

[commands.test]
run = [
  "cargo test --manifest-path init/Cargo.toml",
  "./scripts/installer/test-raven-install.sh",
]

[commands.qemu]
run = ["./scripts/test-qemu.sh --console"]

[commands.qemu-desktop]
run = ["./scripts/test-qemu.sh --desktop"]

[commands.smoke]
run = ["./scripts/test-qemu.sh --console --timeout 180"]

[commands.shell]
run = ["{{run}} shell"]

[commands.clean]
run = [
  "echo \">> Removing build artifacts in ./build ...\"",
  "rm -rf build 2>/dev/null || { echo \"!! Some artifacts are root-owned (created by the privileged container).\"; echo \"!! Remove them with: sudo rm -rf build\"; exit 1; }",
  "echo \">> Done.\"",
]

[commands.clean-image]
run = [
  "echo \">> Removing image '{{image}}' ...\"",
  "{ command -v docker >/dev/null 2>&1 && docker rmi -f '{{image}}'; } || { command -v podman >/dev/null 2>&1 && podman rmi -f '{{image}}'; } || echo \"!! No docker/podman found, or image not present.\"",
]

[commands.distclean]
dep = ["clean", "clean-image"]

[commands.make_help]
run = [
  "echo \"RavenLinux build (containerized -- runs on macOS, Windows, or Linux)\"",
  "echo \"\"",
  "echo \"Usage: make <target> [JOBS=N] [ARCH=x86_64] [ENGINE=docker|podman] [IMAGE=tag]\"",
  "echo \"\"",
  "echo \"Targets:\"",
  "grep -E '^[a-zA-Z0-9 _-]+:.*?## .*$' {{makefile_list}} | sort | awk 'BEGIN {FS = \":.*?## \"}; {printf \" \\033[36m%-13s\\033[0m %s\\n\", $1, $2}'",
]

# Migration notes:
# - evaluated with ENGINE="" at migrate time: RAVEN_IMAGE='$(IMAGE)' $(if $(strip $(ENGINE)),RAVEN_ENGINE='$(ENGINE)',)
# - evaluated with ARCH="" JOBS="" at migrate time: $(if $(strip $(JOBS)),-j $(JOBS),) $(if $(strip $(ARCH)),-a $(ARCH),)
