[package]
name = "raven-boot"
version = "0.1.0"
edition = "2021"
authors = ["RavenLinux Team"]
description = "RavenLinux Custom UEFI Bootloader"
license = "MIT"

[dependencies]
# UEFI support
uefi = { version = "0.28", features = ["alloc"] }
uefi-services = "0.25"

# Logging
log = "0.4"

# Floating-point maths. `core` has none, and gfx.rs is a distance-field
# rasterizer -- see the note at the bottom of that file.
libm = "0.2"

[build-dependencies]
# Rasterizes the menu's font into an atlas at build time. Host-side only: it
# never reaches the .efi, only the coverage bitmaps it produces do.
ab_glyph = "0.2"
# Decodes branding/raven-logo-light.png into the mark bitmap. Host-side only,
# like ab_glyph: the .efi carries the decoded pixels, not a PNG decoder.
png = "0.17"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"  # Optimize for size

# Target configuration for UEFI
# Build with: cargo build --target x86_64-unknown-uefi
