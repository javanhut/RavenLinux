[package]
name = "eagleeye"
# The upstream version only, and the base a build appends a revision to. This
# component is cloned from its own repository and tracks that repository's
# default branch unless RAVEN_USE_MANIFEST_PINS=1, so the package carries
# +r<committer date>.g<commit> for the checkout that was actually compiled --
# raven_component_version in scripts/lib/components.sh composes it.
version = "0.1.0"
description = "EagleEye - the image viewer"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/javanhut/EagleEye"
repository = "https://github.com/javanhut/EagleEye"
maintainers = ["RavenLinux Team"]
categories = ["gui", "wayland", "application"]

[source]
type = "git"
url = "https://github.com/javanhut/EagleEye.git"
# Unpinned, like ravengui, ravenlogin and ravencanvas: nothing has been tagged
# in that repository yet. A `commit` added here is read by the GUI stage
# through raven_resolve_ref, so pinning it at the first release is a one-line
# change here and nowhere else.

[build]
system = "cargo"
# The same glibc target as raven-viewer, for the same reason: GTK4 and
# libadwaita have no musl build. Every raster decoder it links (image,
# fast_image_resize) and its SVG renderer (resvg) are pure Rust, so nothing
# beyond the GTK toolkit is linked.
target = "x86_64-unknown-linux-gnu"
build_flags = ["--release", "--locked"]

[dependencies]
# Shared libraries are resolved with ldd at build time -- see
# stage_gui_libraries() in stage-gui.sh. What is listed is what a package
# manager would have to install on a system that did not get those files
# staged off a build host.
#
# glycin and bubblewrap are here for a reason particular to this application.
# The formats image-rs knows are decoded in-process, but HEIC, AVIF and JPEG XL
# fall through to gdk::Texture::from_filename -- loader.rs's `fallback` -- which
# is GTK's out-of-process glycin loaders, and glycin refuses to decode outside
# a bwrap sandbox. Without the pair those three formats fail to open and
# nothing else does, which is the most confusing way for this to break.
runtime = [
    "gtk4", "libadwaita", "glib2", "gsettings-desktop-schemas",
    "shared-mime-info", "desktop-file-utils", "hicolor-icon-theme",
    "glycin", "bubblewrap",
]
build = ["rust", "cargo", "pkg-config", "gtk4", "libadwaita", "glib2"]

[install]
files = [
    { src = "target/x86_64-unknown-linux-gnu/release/eagleeye", dest = "/usr/bin/eagleeye", mode = 755 },
    { src = "data/icons/hicolor/scalable/apps/com.eagleeye.Raven.svg", dest = "/usr/share/icons/hicolor/scalable/apps/com.eagleeye.Raven.svg", mode = 644 },
    { src = "data/com.eagleeye.Raven.metainfo.xml", dest = "/usr/share/metainfo/com.eagleeye.Raven.metainfo.xml", mode = 644 }
]

# data/raven-glass*.css are deliberately absent: src/theme.rs include_str!s
# both, so the stylesheets are inside the binary.
#
# The upstream data/com.eagleeye.Raven.desktop is deliberately not in this list
# either. install_desktop_entries() in scripts/stages/stage-gui.sh writes every
# application entry on this image, and the one it writes is also what claims
# the image MIME types in mimeapps.list.

# usr-merged root: no /bin aliases. See scripts/lib/usrmerge.sh.
symlinks = []
