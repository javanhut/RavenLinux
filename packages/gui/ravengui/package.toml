[package]
name = "ravengui"
version = "0.0.1"
description = "RavenGUI - the Huginn compositor, the shell it draws, and the Muninn lock screen"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/javanhut/RavenGUI"
repository = "https://github.com/javanhut/RavenGUI"
maintainers = ["RavenLinux Team"]
categories = ["gui", "wayland"]

[source]
type = "git"
url = "https://github.com/javanhut/RavenGUI.git"
# Deliberately unpinned, like ravenlogin and ravencanvas below. The reason here
# is not "nothing has been tagged yet" but that the pin named a commit nothing
# built: the GUI stage fetches this repository itself (fetch_repo in
# scripts/stages/stage-gui.sh, with no ref) and hard-resets to the default
# branch, so every image carries HEAD while this file claimed 69a7414. A hash
# that disagrees with what ships is worse than no hash -- it reads like a
# guarantee. Pin it at the first release, and pin the GUI stage with it.

[build]
system = "cargo"
# NOT the musl target. Unlike everything under packages/raven, this links
# against glibc: smithay reaches the hardware through libdrm, libgbm, libinput,
# libseat and libudev, and Mesa's EGL/GLES drivers are dlopened at run time.
# The sysroot carries the host's glibc and dynamic linker already, which is how
# the Xorg and Mesa binaries stage2 copies work.
target = "x86_64-unknown-linux-gnu"
build_flags = ["--release", "--locked", "-p", "huginn-comp"]

[dependencies]
# Build dependencies are the development side of what it links. The runtime
# list is resolved with ldd at build time rather than written out here, because
# it is not knowable from the manifests: libinput drags in libwacom, which
# drags in lua. See stage_gui_libraries() in scripts/stages/stage-gui.sh.
# xorg-xwayland is the X server huginn drives for X11 clients. Optional in the
# sense that the compositor starts without it and logs "XWayland unavailable" --
# but X11 applications then cannot run at all, so it is listed as runtime rather
# than left to chance.
# The icon themes and the fonts are runtime dependencies in the strongest
# sense: the compositor starts without them and is visibly broken.
# adwaita-cursors is what /usr/share/icons/default inherits, and without it the
# compositor draws no pointer at all over its own surfaces. breeze-icons is
# what dock and launcher Icon= names resolve against. ttf-dejavu is the only
# proportional face on the image; without it every label the shell draws is
# monospace, and anything outside Latin/Greek/Cyrillic draws blank.
#
# raven-terminal is not listed here because it is not a package this one
# depends on -- stage-gui.sh builds it from its own repository alongside
# huginn. It is a hard runtime requirement of the *desktop* all the same:
# huginn names it in two compiled-in places, so without it a running desktop
# can launch nothing at all.
runtime = [
    "mesa", "libdrm", "libinput", "libseat", "libudev", "libxkbcommon", "seatd",
    "xorg-xwayland", "adwaita-cursors", "breeze-icons", "hicolor-icon-theme",
    "ttf-dejavu", "noto-fonts-emoji", "pipewire", "pipewire-audio", "wireplumber",
]
build = ["rust", "cargo", "pkg-config", "libdrm", "libinput", "libudev", "mesa"]

[install]
files = [
    { src = "target/x86_64-unknown-linux-gnu/release/huginn",      dest = "/usr/bin/huginn",      mode = 755 },
]

# No /bin -> /usr/bin aliases here. This root is usr-merged, so /bin IS
# /usr/bin: a link at /bin/<name> whose target is /usr/bin/<name> names the
# same path on both sides, and creating it replaces the real binary with a
# symlink to itself. Anything installed to /usr/bin is already reachable at
# /bin/<name> through the merge link -- see scripts/lib/usrmerge.sh.
symlinks = []

# /bin/raven-wayland-session is generated by the GUI stage rather than shipped
# from the repo: raven-init starts it when the kernel cmdline carries
# raven.graphics=wayland, and it execs huginn. There is no shell client after
# it: the dock, launcher and notifications are drawn by the compositor.
#
# /bin/raven-terminal comes from a different repository entirely --
# javanhut/RavenTerminal, built by the same stage with `go build -tags wayland`.
# It is not part of this package and has no manifest of its own yet; the stage
# is the only place it is described. The GUI stage also writes
# /usr/share/applications, which nothing populated before -- the launcher
# enumerated an empty directory and the dock's pinned entry matched nothing.
