[package]
name = "caw"
version = "0.1.0"
description = "CAW (Corvus Access Wifi) - wireless and network utility"
license = "MIT"
homepage = "https://github.com/javanhut/CAW"
repository = "https://github.com/javanhut/CAW"
maintainers = ["RavenLinux Team"]
categories = ["raven", "network"]

[source]
type = "git"
url = "https://github.com/javanhut/CAW.git"
commit = "b58a39444e7ada1c077d5733020bfd2578c3d8f8"

[build]
system = "cargo"
# Built against the musl target so the result is statically linked and carries
# no runtime dependency on the sysroot's libraries. CAW is unusually clean
# here: rustix runs on its linux_raw backend and issues syscalls directly, and
# all crypto is RustCrypto, so the tree contains no C at all.
target = "x86_64-unknown-linux-musl"
build_flags = ["--release", "--locked", "-p", "caw", "-p", "cawd"]

# No --features: the `enterprise` feature (WPA2/3-Enterprise, 802.1X) pulls a
# C crypto provider in through rustls, which would end the static-musl build.
# Turn it on only in a build that can carry that dependency.

[dependencies]
runtime = []
build = ["rust", "cargo"]

[install]
files = [
    { src = "target/x86_64-unknown-linux-musl/release/caw",  dest = "/usr/bin/caw",  mode = 755 },
    { src = "target/x86_64-unknown-linux-musl/release/cawd", dest = "/usr/bin/cawd", mode = 755 }
]

# No /bin -> /usr/bin aliases here. This root is usr-merged, so /bin IS
# /usr/bin: a link at /bin/<name> whose target is /usr/bin/<name> names the
# same path on both sides, and creating it replaces the real binary with a
# symlink to itself. Anything installed to /usr/bin is already reachable at
# /bin/<name> through the merge link -- see scripts/lib/usrmerge.sh.
symlinks = []

# Declarative only: nothing in the build reads these manifests today, so this
# records the requirement rather than satisfying it. The directory is actually
# created by scripts/lib/skeleton.sh, at 0700 to match StateDirectoryMode.
directories = [
    "/var/lib/caw"
]

# /var/lib/caw has to exist before cawd starts, and cawd cannot make it.
#
# This comment used to say cawd creates both its directories itself and there
# was nothing to pre-create. Half true, and the wrong half. `profile::save`
# calls a helper that is a single-level `mkdir(2)` (caw-core/src/profile.rs),
# so it creates the `profiles` leaf and not its parent. /run/caw works for
# exactly that reason -- its parent /run always exists -- while
# /var/lib/caw/profiles fails with ENOENT, `save` returns Err, and the
# passphrase is silently never written. `caw connect` still associates, so the
# only visible symptom is that the machine does not rejoin after a reboot.
#
# CAW is not wrong to expect this: its systemd unit declares
# `StateDirectory=caw` with `StateDirectoryMode=0700`, and systemd creates the
# directory before the daemon runs. Nothing honours that contract here, so the
# package does -- with the same mode upstream asks for.
#
# dist/cawd.service and
# dist/caw.sysusers from the upstream tree are systemd artifacts and are not
# installed: RavenLinux runs raven-init, which takes its service definition
# from /etc/raven/init.toml, and the `caw` group is created in stage2.
