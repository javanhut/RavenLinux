[package]
name = "imlazy"
# The upstream version only, and the base a build appends a revision to. This
# component is cloned from its own repository and tracks that repository's
# default branch unless RAVEN_USE_MANIFEST_PINS=1, so the package carries
# +r<committer date>.g<commit> for the checkout that was actually compiled --
# raven_component_version in scripts/lib/components.sh composes it.
version = "0.3.0"
description = "ImLazy - task runner driven by lazy.toml"
license = "NOASSERTION"
homepage = "https://github.com/javanhut/ImLazy"
repository = "https://github.com/javanhut/ImLazy"
maintainers = ["RavenLinux Team"]
categories = ["raven", "build-tools"]
# Stated rather than derived. rvn takes the architecture from [build]
# target when [package] does not say, which is right for a Rust triple
# and wrong for a Go package path -- `.` would become the
# architecture and land in the package filename.
arch = "x86_64"

[source]
type = "git"
url = "https://github.com/javanhut/ImLazy.git"
commit = "98cb1835bf1ca698892030ad48c7708d955dd832"

[build]
system = "go"
# CGO_ENABLED=0 makes this a fully static binary with no libc linkage, so it
# runs on the musl sysroot without any runtime dependency.
env = { CGO_ENABLED = "0", GOOS = "linux", GOARCH = "amd64" }
build_flags = ["-trimpath", "-ldflags", "-s -w"]
target = "."

[dependencies]
runtime = []
build = ["go"]

[install]
files = [
    { src = "imlazy", dest = "/usr/bin/imlazy", mode = 755 }
]

# No /bin -> /usr/bin aliases here. This root is usr-merged, so /bin IS
# /usr/bin: a link at /bin/<name> whose target is /usr/bin/<name> names the
# same path on both sides, and creating it replaces the real binary with a
# symlink to itself. Anything installed to /usr/bin is already reachable at
# /bin/<name> through the merge link -- see scripts/lib/usrmerge.sh.
symlinks = []
