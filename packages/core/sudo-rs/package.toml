[package]
name = "sudo-rs"
version = "0.2.10"
description = "Memory-safe implementation of sudo and su"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/trifectatechfoundation/sudo-rs"
repository = "https://github.com/trifectatechfoundation/sudo-rs"
maintainers = ["RavenLinux Team"]
categories = ["core", "security", "utilities"]

[source]
type = "git"
url = "https://github.com/trifectatechfoundation/sudo-rs.git"
commit = "11af1a320d5c447e2c36ad9a0c14c6c7c638d3fc"

[build]
system = "cargo"
build_flags = ["--release"]

[dependencies]
runtime = []
build = ["rust"]

[install]
files = [
    { src = "target/release/sudo", dest = "/usr/bin/sudo", mode = 755 },
    { src = "target/release/su", dest = "/usr/bin/su", mode = 755 },
    { src = "target/release/visudo", dest = "/usr/bin/visudo", mode = 755 }
]

# No /bin -> /usr/bin aliases here. This root is usr-merged, so /bin IS
# /usr/bin: a link at /bin/<name> whose target is /usr/bin/<name> names the
# same path on both sides, and creating it replaces the real binary with a
# symlink to itself. Anything installed to /usr/bin is already reachable at
# /bin/<name> through the merge link -- see scripts/lib/usrmerge.sh.
symlinks = []
